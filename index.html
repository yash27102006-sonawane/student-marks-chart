<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Student Marks Chart</title>

    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .container {
            background: white;
            width: 700px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            color: #333;
        }

        canvas {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Student Marks Dashboard</h1>

        <p>Student: <b>Yash Sonawane</b></p>
        <p>Branch: <b>CSE (AI & ML)</b></p>

        <canvas id="marksChart"></canvas>
    </div>

    <script>
       
        const subjects = ["Python", "Java", "DBMS", "Maths", "Web Development"];
        const marks = [85, 78, 82, 90, 88];

        new Chart(document.getElementById("marksChart"), {
            type: "bar",

            data: {
                labels: subjects,

                datasets: [{
                    label: "Student Marks",
                    data: marks,
                    borderWidth: 1
                }]
            },

            options: {
                responsive: true,

                scales: {
                    y: {
                        beginAtZero: true,
                        max: 100
                    }
                }
            }
        });
    </script>

</body>
</html>
